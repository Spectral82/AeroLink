[project]
name = "aerolink"
version = "0.1.0"
description = "Сбор данных о самолётах по странам через OpenSky и Nominatim"
authors = [
    {name = "Roman", email = "Spctrl82@yandex.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2,<3.0.0",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^5.0.0"
isort = "^8.0.1"
black = "^26.5.1"
flake8 = "^7.3.0"
mypy = "^2.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
skip = ["venv", ".venv", "__pycache__", "build", "dist"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]